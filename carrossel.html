<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Carrossel · HUB Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  :root{--bg:#E8F1F0;--panel:#fff;--card:#F4F9F8;--hover:#E9F3F1;--line:#DCE8E6;--ink:#23332F;--mute:#5E726D;--dim:#93A5A1;--gold:#E3A31B;--goldink:#8A5E0A;--goldbg:#FDF1D6;--menu:#3A5049;--live:#1E874B;--ame:#573151}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;overflow-x:hidden;-webkit-text-size-adjust:100%}
  a{color:inherit;text-decoration:none}
  button,textarea{font-family:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 18px 130px;container-type:inline-size}
  .voltar{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--menu);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin-bottom:14px}
  .hdr{margin:0 4px 22px}
  .st{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:4px 11px}
  .st.aguardando{background:var(--goldbg);color:#6B4706}.st.ajuste{background:#F7DDDD;color:#9A3B3B}.st.ajustado{background:#EFE3F7;color:#5B2D7A}
  .st.aprovado{background:#DDEBDD;color:#2E6B3E}.st.agendado{background:#E6EEF9;color:#2C3E6B}.st.publicado{background:#E3E8E6;color:#3A5049}
  .hdr h1{font-size:clamp(1.4rem,4.6vw,2rem);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:10px 0 4px}
  .hdr .tipo{color:var(--mute);font-size:.92rem}
  .aviso{margin-top:12px;font-size:.9rem;border-radius:14px;padding:11px 14px;background:#FFF6E6;color:#8A4B12}
  .aviso.azul{background:#E6EEF9;color:#2C3E6B}.aviso.lilas{background:#F3EAF9;color:#5B2D7A}
  .como{margin-top:12px;font-size:.88rem;color:var(--mute)}

  .lam{display:grid;grid-template-columns:minmax(0,600px) minmax(260px,1fr);gap:22px;align-items:start;margin-bottom:26px}
  .lam .img{position:relative;border-radius:18px;overflow:hidden;background:#F3ECE4;box-shadow:0 2px 4px rgba(35,51,47,.06),0 14px 34px -14px rgba(35,51,47,.28);aspect-ratio:4/5}
  .lam .img img{width:100%;height:100%;display:block;object-fit:cover}
  .lam .n{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 7px 4px}
  .lam .lado{position:sticky;top:18px;margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .lam label{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;line-height:1.45;color:var(--ink);background:var(--card);resize:vertical;outline:none;transition:border-color .15s,background .15s}
  textarea:focus{border-color:var(--menu);background:#fff}
  .lam textarea{min-height:84px}
  .lam textarea.tem{border-color:var(--gold);background:#FFFBF0}
  .ant{margin-top:8px;font-size:.86rem;color:#9A3B3B;background:#FBEDED;border-radius:10px;padding:6px 9px}

  .bloco{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:0 1px 2px rgba(35,51,47,.05)}
  .bloco h2{font-size:.85rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
  .bloco .sub{font-size:.9rem;color:var(--mute);margin-bottom:10px}
  #leg{min-height:300px;background:#fff;border-color:#B9CCC7}
  .legrod{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
  .legrod small{color:var(--mute);font-size:.85rem}
  .legrod small.longo{color:#9A3B3B;font-weight:700}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:800;border-radius:12px;padding:11px 16px;cursor:pointer;border:1px solid var(--menu);background:var(--menu);color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:var(--menu);border-color:var(--line)}
  .btn.ok{background:var(--live);border-color:var(--live)}
  .btn.aj{background:var(--gold);border-color:var(--gold);color:#23332F}
  .btn:disabled{background:#fff;border-color:var(--line);color:#8A9A96;cursor:default;transform:none}
  .btn.okg{background:#fff;color:var(--live);border-color:var(--live)}
  .salvo{font-size:.85rem;font-weight:700;color:var(--live);margin-right:auto}
  .hb summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}.hb summary::-webkit-details-marker{display:none}.hb summary:after{content:'▾';color:var(--mute)}.hb[open] summary:after{content:'▴'}.hb[open] summary{margin-bottom:10px}.hb{background:var(--card)}
  #geral{min-height:110px}
  .hist{list-style:none;display:grid;gap:8px}
  .hist li{font-size:.9rem;background:#fff;border-radius:12px;padding:9px 12px}
  .hist li b{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
  .hist li.feito{opacity:.6}

  .barra{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .barra .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .barra .txt{flex:1;min-width:0;font-size:.85rem;color:var(--mute)}
  .barra .txt b{color:var(--ink)}
  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#23332F;color:#fff;font-size:.9rem;font-weight:600;border-radius:12px;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;max-width:calc(100% - 32px);text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .md{position:fixed;inset:0;background:rgba(20,30,27,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
  .md.on{display:flex}
  .mdbox{background:#fff;border-radius:22px;max-width:440px;width:100%;padding:22px}
  .mdbox h3{font-size:1.15rem;font-weight:800;margin-bottom:6px}
  .mdbox p{color:var(--mute);font-size:.92rem;margin-bottom:16px}
  .mdbox .acts{display:flex;gap:10px;justify-content:flex-end}
  .carregando{padding:60px 10px;text-align:center;color:var(--mute)}

  @container (max-width:820px){
    .lam{grid-template-columns:minmax(0,1fr);gap:10px;margin-bottom:28px;max-width:600px;margin-left:auto;margin-right:auto}
    .lam .lado{position:static;padding:12px;margin-top:0}
    .lam textarea{min-height:64px}
  }
  @media(min-width:901px){.barra{left:260px}}
  @media(max-width:640px){
    .wrap{padding:16px 12px 130px}
    .barra .txt{display:none}
    .barra .btn{flex:1;padding:12px 10px}
  }
  @media(hover:hover){.btn:hover{opacity:.92}}
</style>
</head>
<body>
<div class="wrap">
  <a class="voltar" href="carrosseis.html">← Carrosséis</a>
  <div id="app"><div class="carregando">Carregando o carrossel…</div></div>
</div>
<div class="barra" id="barra" hidden><div class="in">
  <div class="txt" id="barraTxt"></div>
  <button class="btn aj" id="bAj" disabled>Enviar ajustes</button>
  <button class="btn ok" id="bOk">Aprovar</button>
</div></div>
<div class="md" id="md"><div class="mdbox">
  <h3 id="mdT"></h3><p id="mdP"></p>
  <div class="acts"><button class="btn ghost" id="mdN">Voltar</button><button class="btn ok" id="mdS">Confirmar</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
var ID=new URLSearchParams(location.search).get('id'), C=null, LEG0='';
var NOME={aguardando:'Para revisar',ajuste:'Ajuste pedido',ajustado:'Ajustado, olhar de novo',aprovado:'Aprovado',agendado:'Agendado',publicado:'Publicado'};
var ABERTO=['aguardando','ajuste','ajustado'];
function $(i){return document.getElementById(i);}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(b){return fetch('/api/n8n/motor-carrosseis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('on');},3200);}
function confirma(t,p,ok){ $('mdT').textContent=t; $('mdP').textContent=p; $('md').classList.add('on'); $('mdS').onclick=function(){ $('md').classList.remove('on'); ok(); }; }
$('mdN').onclick=function(){ $('md').classList.remove('on'); };
function fmt(iso){ var d=new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }

function carregar(){
  api({acao:'listar'}).then(function(d){
    C=(d.dados||[]).filter(function(x){return x.id===ID;})[0];
    if(!C){ $('app').innerHTML='<div class="carregando">Não achei esse carrossel. <a href="carrosseis.html" style="text-decoration:underline">Voltar pra lista</a></div>'; return; }
    document.title=C.titulo+' · Carrosséis'; montar();
  }).catch(function(){ $('app').innerHTML='<div class="carregando">Não consegui carregar. Recarrega a página.</div>'; });
}

function montar(){
  var aberto=ABERTO.indexOf(C.status)>=0;
  var pend=(C.ajustes||[]).filter(function(a){return !a.resolvido;});
  var ult=pend.length?pend[pend.length-1]:null;
  var av='';
  if(C.status==='ajuste') av='<div class="aviso">Ajuste enviado'+(ult?' por '+esc(ult.por)+' em '+fmt(ult.em):'')+'. O Bruno vai refazer e o carrossel volta pra cá como "Ajustado".</div>';
  if(C.status==='ajustado') av='<div class="aviso lilas">Versão nova com os ajustes pedidos. Confere as lâminas e aprova, ou pede mais um ajuste.</div>';
  if(C.status==='agendado') av='<div class="aviso azul">Aprovado'+(C.aprovado_por?' por '+esc(C.aprovado_por):'')+'. Vai ao ar <b>'+esc(C.agendado_dia)+' às 20h</b> no Instagram e no Facebook do Manual.</div>';
  if(C.status==='publicado') av='<div class="aviso azul">Esse carrossel já foi publicado.</div>';
  var h='<div class="hdr"><span class="st '+C.status+'">'+NOME[C.status]+'</span><h1>'+esc(C.titulo)+'</h1><div class="tipo">'+esc(String(C.tipo).replace(/\s*·\s*template.*$/i,''))+' · '+C.laminas.length+' lâminas</div>'
    +(C.obs?'<div class="aviso">'+esc(C.obs)+'</div>':'')+av
    +(aberto?'<p class="como">Quer mudar algo? Escreve no campo da lâmina (só onde precisar) e toca em <b>Enviar ajustes</b>. Tudo certo? Toca em <b>Aprovar</b>.</p>':'')+'</div>';
  C.laminas.forEach(function(u,i){
    var n=i+1, antes=(ult&&ult.slides&&ult.slides[n])?'<div class="ant">Pedido anterior: '+esc(ult.slides[n])+'</div>':'';
    h+='<div class="lam"><div><span class="n">Lâmina '+n+' de '+C.laminas.length+'</span><div class="img"><img src="'+esc(u)+'" alt="Lâmina '+n+'" '+(i>1?'loading="lazy"':'')+'></div></div>'
      +(aberto?'<div class="lado"><label for="aj'+n+'">Ajuste na lâmina '+n+'</label><textarea id="aj'+n+'" data-n="'+n+'" placeholder="Ex.: trocar a palavra X por Y"></textarea>'+antes+'</div>':'<div></div>')+'</div>';
  });
  h+='<div class="bloco"><h2>Legenda</h2><div class="sub">'+(C.status==='publicado'?'Legenda publicada.':'✏️ Toca no texto pra editar. Salva sozinho e é essa legenda que vai pro post.')
    +(C.legenda_editada_por?' Última edição: '+esc(C.legenda_editada_por)+' em '+esc(C.legenda_editada_fmt)+'.':'')+'</div>'
    +'<textarea id="leg" '+(C.status==='publicado'?'readonly':'')+'></textarea>'
    +'<div class="legrod"><small id="legN"></small><span class="salvo" id="legS"></span><button class="btn ghost" id="bCp">Copiar legenda</button></div></div>';
  if(aberto) h+='<div class="bloco"><h2>Ajuste geral</h2><div class="sub">Algo que vale pro carrossel inteiro (tom, ordem, tema). Opcional.</div><textarea id="geral" placeholder="Ex.: deixar mais leve, trocar a ordem das lâminas 3 e 4"></textarea></div>';
  var hist=(C.ajustes||[]).slice().reverse();
  if(hist.length) h+='<details class="bloco hb"><summary><h2>Ajustes já pedidos ('+hist.length+')</h2></summary><ul class="hist">'+hist.map(function(a){
    var it=Object.keys(a.slides||{}).sort(function(x,y){return x-y;}).map(function(k){return 'Lâmina '+k+': '+esc(a.slides[k]);});
    if(a.geral) it.push('Geral: '+esc(a.geral));
    return '<li class="'+(a.resolvido?'feito':'')+'"><b>'+esc(a.por)+' · '+fmt(a.em)+(a.resolvido?' · feito':'')+'</b><br>'+it.join('<br>')+'</li>';
  }).join('')+'</ul></details>';
  $('app').innerHTML=h;
  LEG0=C.legenda||''; $('leg').value=LEG0; contaLeg();
  $('leg').addEventListener('input',function(){ contaLeg(); if(C.status==='publicado') return; $('legS').textContent='Salvando…'; clearTimeout(window._lt); window._lt=setTimeout(function(){ salvarLeg().then(function(ok){ $('legS').textContent=ok?'✓ Salva':''; }); },1200); });
  $('leg').addEventListener('blur',function(){ if(C.status!=='publicado'&&$('leg').value!==LEG0){ clearTimeout(window._lt); salvarLeg().then(function(ok){ $('legS').textContent=ok?'✓ Salva':''; }); } });
  $('bCp').onclick=function(){ navigator.clipboard.writeText($('leg').value).then(function(){ toast('Legenda copiada'); }); };
  document.querySelectorAll('.lam textarea,#geral').forEach(function(t){ t.addEventListener('input',barra); });
  barra();
}
function contaLeg(){ var n=$('leg').value.length, e=$('legN'); e.textContent=n+' de 2.200 caracteres'; e.classList.toggle('longo',n>2200); }
function ajustesDigitados(){ var s={}; document.querySelectorAll('.lam textarea').forEach(function(t){ t.classList.toggle('tem',!!t.value.trim()); if(t.value.trim()) s[t.dataset.n]=t.value.trim(); }); return s; }
function barra(){
  var b=$('barra'), aberto=ABERTO.indexOf(C.status)>=0;
  b.hidden=!(aberto||C.status==='agendado');
  if(C.status==='agendado'){ $('bAj').hidden=true; $('bOk').textContent='Desfazer aprovação'; $('bOk').className='btn ghost'; $('barraTxt').innerHTML='Vai ao ar <b>'+esc(C.agendado_dia)+' às 20h</b>'; return; }
  $('bAj').hidden=false; $('bOk').textContent='Aprovar'; $('bOk').className='btn ok';
  var n=Object.keys(ajustesDigitados()).length+($('geral')&&$('geral').value.trim()?1:0);
  $('bAj').disabled=!n; $('bAj').textContent=n?'Enviar ajustes ('+n+')':'Enviar ajustes';
  $('bAj').className=n?'btn aj':'btn ghost'; $('bOk').className=n?'btn okg':'btn ok';
  $('barraTxt').innerHTML=n?'<b>'+n+(n===1?' ajuste escrito':' ajustes escritos')+'</b>, ainda não enviado'+(n===1?'':'s'):'Tudo certo? Aprova. Algo pra mudar? Escreve embaixo da lâmina.';
}
function salvarLeg(){
  if($('leg').value===LEG0) return Promise.resolve(true);
  if($('leg').value.length>2200){ toast('A legenda passou de 2.200 caracteres (limite do Instagram)'); return Promise.resolve(false); }
  return api({acao:'legenda',id:ID,legenda:$('leg').value}).then(function(d){
    if(!d.ok){ toast(d.erro||'Não salvou'); return false; }
    LEG0=$('leg').value; C.legenda=LEG0; return true;
  }).catch(function(){ toast('Sem conexão, tenta de novo'); return false; });
}
$('bAj').onclick=function(){
  var s=ajustesDigitados(), g=$('geral')?$('geral').value.trim():'';
  if(!Object.keys(s).length&&!g) return;
  $('bAj').disabled=true; $('bAj').textContent='Enviando…';
  salvarLeg().then(function(){ return api({acao:'ajustes',id:ID,titulo:C.titulo,slides:s,geral:g}); }).then(function(d){
    if(!d.ok){ toast(d.erro||'Não enviou'); barra(); return; }
    toast('Ajustes enviados pro Bruno'); window.scrollTo({top:0,behavior:'smooth'}); carregar();
  }).catch(function(){ toast('Sem conexão, tenta de novo'); barra(); });
};
$('bOk').onclick=function(){
  if(C.status==='agendado'){
    confirma('Desfazer a aprovação?','O post sai do Publicador e o carrossel volta pra "Para aprovação".',function(){
      api({acao:'voltar',id:ID}).then(function(d){ if(!d.ok){ toast(d.erro||'Não deu'); return; } toast('Aprovação desfeita'); carregar(); });
    }); return;
  }
  var pend=Object.keys(ajustesDigitados()).length||($('geral')&&$('geral').value.trim());
  confirma('Aprovar este carrossel?',(pend?'Tem ajuste escrito que não foi enviado: ele será descartado. ':'')+'Ele entra no Publicador às 20h do próximo dia livre, no Instagram e no Facebook do Manual, com a legenda que está na tela.',function(){
    $('bOk').disabled=true;
    salvarLeg().then(function(ok){ if(!ok) throw 0; return api({acao:'aprovar',id:ID}); }).then(function(d){
      $('bOk').disabled=false;
      if(!d.ok){ toast(d.erro||'Não aprovou'); return; }
      toast('Aprovado! Vai ao ar '+d.dados[0].agendado_dia+' às 20h'); window.scrollTo({top:0,behavior:'smooth'}); carregar();
    }).catch(function(){ $('bOk').disabled=false; });
  });
};
document.addEventListener('keydown',function(e){ if(e.key==='Escape') $('md').classList.remove('on'); });
window.addEventListener('beforeunload',function(e){ if(!C) return; var tem=Object.keys(ajustesDigitados()).length||($('geral')&&$('geral').value.trim())||($('leg')&&$('leg').value!==LEG0); if(tem){ e.preventDefault(); e.returnValue=''; } });
if(!ID) location.replace('carrosseis.html'); else carregar();
</script>
<script src="sidebar.js?v=20261030c" defer></script>
</body>
</html>
