<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Agente de Copy · HUB Conteúdo do Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  :root{--bg:#E8F1F0;--panel:#fff;--card:#F4F9F8;--hover:#E9F3F1;--line:#DCE8E6;--ink:#23332F;--mute:#6E827D;--dim:#93A5A1;--gold:#E3A31B;--gold2:#C88C10;--goldbg:#FDF1D6;--teal:#17A2A0;--menu:#3A5049;--menuTxt:#E7EEEC;--menuMute:#9DB3AD;--danger:#D64545}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5}
  .top{background:var(--menu);color:var(--menuTxt);padding:18px 22px}
  .bk{display:inline-flex;align-items:center;gap:6px;color:var(--menuMute);text-decoration:none;font-size:.82rem;font-weight:700;margin-bottom:10px}
  .bk:hover{color:var(--menuTxt)}
  .top h1{font-size:1.24rem;font-weight:800;letter-spacing:-.01em}
  .top p{color:var(--menuMute);font-size:.85rem;margin-top:3px;max-width:660px}
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 70px}
  .who{display:flex;align-items:center;gap:10px;margin:4px 2px 18px;flex-wrap:wrap}
  .who label{font-size:.8rem;color:var(--mute);font-weight:700}
  .who input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:.88rem;color:var(--ink);min-width:180px}
  .pills{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}
  .pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-size:.86rem;font-weight:700;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .12s}
  .pill:hover{border-color:var(--gold)}
  .pill.active{background:var(--menu);color:var(--menuTxt);border-color:var(--menu)}
  .pill .d{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .pill.filled .d{background:var(--teal)}
  .pill.active.filled .d{background:#7fe3e1}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 22px 24px;box-shadow:0 1px 2px rgba(35,51,47,.04),0 8px 22px rgba(35,51,47,.06)}
  .fld{margin-bottom:20px}
  .fld h3{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
  .fld .chip{font-size:.64rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 8px}
  .chip.copy{background:var(--goldbg);color:var(--gold2)}
  .chip.cri{background:#DDF3F2;color:#0E7F7D}
  .fld p{color:var(--mute);font-size:.8rem;margin:3px 0 9px}
  textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:13px 14px;font-size:.9rem;line-height:1.55;color:var(--ink);font-family:inherit}
  textarea:focus{outline:none;border-color:var(--gold);background:#fff}
  .bar{display:flex;align-items:center;gap:14px;margin-top:6px}
  .save{background:var(--gold);color:#fff;border:none;border-radius:12px;padding:12px 24px;font-size:.92rem;font-weight:800;cursor:pointer;transition:background .12s}
  .save:hover{background:var(--gold2)}
  .save:disabled{opacity:.55;cursor:default}
  .status{font-size:.82rem;color:var(--mute)}
  .status.ok{color:#0E7F7D}
  .status.err{color:var(--danger)}
  footer{color:var(--dim);text-align:center;font-size:.78rem;padding:20px 20px 40px}
</style>
</head>
<body>
<div class="top">
  <a class="bk" href="agente-copy.html">← Agente de Copy</a>
  <h1 id="titulo">Agente de Copy</h1>
  <p id="desc"></p>
</div>
<div class="wrap">
  <div class="who">
    <label>Seu nome:</label>
    <input id="who" placeholder="ex: Day" autocomplete="off">
  </div>
  <div class="pills" id="pills"></div>
  <div class="panel">
    <div class="fld">
      <h3><span class="chip copy">Copy</span> <span id="copyLabel">Regras de legenda</span></h3>
      <p id="copyHint"></p>
      <textarea id="copy"></textarea>
    </div>
    <div class="fld">
      <h3><span class="chip cri">Criativo</span> <span id="criLabel">Regras de vídeo / imagem</span></h3>
      <p id="criHint"></p>
      <textarea id="criativo"></textarea>
    </div>
    <div class="bar">
      <button class="save" id="save">Salvar regra</button>
      <span class="status" id="status"></span>
    </div>
  </div>
</div>
<footer>Uso interno · Manual do Recém-Nascido</footer>

<script>
  var CTX = {
    anuncios: {
      titulo: 'Agente de Copy · Anúncios',
      desc: 'Regras dos anúncios pagos (projetos de curso). O Austin usa pra escrever a copy dos anúncios que sobe, seguindo o que você definir aqui.',
      slots: [{k:'pocket',n:'Dream Pocket'},{k:'quiz',n:'Quiz Pocket'},{k:'guia',n:'Guia da Pega'},{k:'mat_calo',n:'Matéria Calo'},{k:'mat_ama',n:'Matéria Amamentação'}],
      copyLabel:'Regras de legenda / texto do anúncio', copyHint:'Tom de voz, ganchos que funcionam, oferta (preço + o que inclui), CTA, o que EVITAR.',
      copyPh:'Ex: Tom acolhedor da Day. Gancho pela dor real (bebê não dorme / não sacia). Oferta: Dream Baby Pocket R$67, plano pronto em ~30 min. CTA: "quero meu plano". EVITAR: promessa de cura, tom alarmista.',
      criLabel:'Regras de vídeo / imagem', criHint:'Formato, primeiros 3s (gancho), o que mostrar, legenda na tela, duração, o que NÃO fazer.',
      criPh:'Ex: Vertical 9:16. Dor na tela nos 3 primeiros segundos. Day falando + b-roll do bebê. Legenda queimada. Até 40s.'
    },
    organico: {
      titulo: 'Agente de Copy · Orgânico',
      desc: 'Regras pra ajudar a Day na criação de conteúdo orgânico (posts e reels do perfil). Por tema.',
      slots: [{k:'amamentacao',n:'Amamentação'},{k:'sono',n:'Sono'},{k:'cuidados',n:'Cuidados com o bebê'},{k:'gestante',n:'Gestante'}],
      copyLabel:'Regras de legenda do post', copyHint:'Tom da Day, formato da legenda, ganchos, como abrir e fechar, CTA (salvar/compartilhar/seguir), hashtags, o que evitar.',
      copyPh:'Ex: Voz da Day, acolhedora e sem julgamento. Abre com a dúvida real da mãe. 1 ideia por post. Fecha convidando a salvar. EVITAR: tom professoral, promessa, mamadeira.',
      criLabel:'Regras do post / reel', criHint:'Formato, o que mostrar, capa, ritmo, legenda na tela, duração.',
      criPh:'Ex: Reel vertical, capa com a dúvida em texto grande. Day em plano médio. Corte a cada ~4s. Legenda queimada sempre.'
    },
    ofertas: {
      titulo: 'Agente de Copy · Ofertas',
      desc: 'Regras pra produção de legendas com chamada (CTA) das ofertas dos nossos afiliados — a base pra automação de postagem.',
      slots: [{k:'geek',n:'Ofertas Geek'},{k:'materno',n:'Ofertas Materno'},{k:'geral',n:'Geral'}],
      copyLabel:'Regras da legenda + CTA da oferta', copyHint:'Estrutura da legenda (preço, desconto, urgência), o CTA e o link, tom, emojis, o que evitar.',
      copyPh:'Ex: Abre com o produto + preço em destaque. Escassez ("por tempo limitado"). CTA claro: "corre no link". Emojis pontuais. EVITAR: exagero, caps lock na frase toda.',
      criLabel:'Regras da imagem / arte da oferta', criHint:'O que a arte deve ter: foto do produto, selo de desconto, formato.',
      criPh:'Ex: Foto real do produto, selo de % OFF no canto, fundo limpo. Formato quadrado pro feed.'
    }
  };
  var ctx = (new URLSearchParams(location.search).get('ctx') || 'anuncios').toLowerCase();
  if(!CTX[ctx]) ctx = 'anuncios';
  var C = CTX[ctx];
  var DATA = {}, cur = C.slots[0].k;
  var elPills=document.getElementById('pills'), elCopy=document.getElementById('copy'), elCri=document.getElementById('criativo'),
      elWho=document.getElementById('who'), elSave=document.getElementById('save'), elStatus=document.getElementById('status');

  document.getElementById('titulo').textContent = C.titulo;
  document.getElementById('desc').textContent = C.desc;
  document.title = C.titulo;
  document.getElementById('copyLabel').textContent = C.copyLabel;
  document.getElementById('copyHint').textContent = C.copyHint;
  document.getElementById('criLabel').textContent = C.criLabel;
  document.getElementById('criHint').textContent = C.criHint;
  elCopy.placeholder = C.copyPh; elCri.placeholder = C.criPh;

  elWho.value = localStorage.getItem('hub-who') || '';
  elWho.addEventListener('input', function(){ localStorage.setItem('hub-who', elWho.value.trim()); });

  function renderPills(){
    elPills.innerHTML='';
    C.slots.forEach(function(f){
      var d=DATA[f.k]||{}; var filled=(d.copy&&d.copy.trim())||(d.criativo&&d.criativo.trim());
      var b=document.createElement('button');
      b.className='pill'+(f.k===cur?' active':'')+(filled?' filled':'');
      b.innerHTML='<span class="d"></span>'+f.n;
      b.onclick=function(){ selectSlot(f.k); };
      elPills.appendChild(b);
    });
  }
  function selectSlot(k){
    DATA[cur]=DATA[cur]||{}; DATA[cur].copy=elCopy.value; DATA[cur].criativo=elCri.value;
    cur=k; var d=DATA[k]||{};
    elCopy.value=d.copy||''; elCri.value=d.criativo||'';
    elStatus.className='status';
    elStatus.textContent = d.by ? ('última edição por '+d.by+(d.at?' · '+fmt(d.at):'')) : 'ainda sem regra cadastrada';
    renderPills();
  }
  function fmt(iso){ try{var dt=new Date(iso);return dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';} }

  function load(){
    fetch('/api/copy').then(function(r){return r.json();}).then(function(j){
      var rg=(j&&j.regras)||{}; DATA=rg[ctx]||{}; selectSlot(cur);
    }).catch(function(){ elStatus.className='status err'; elStatus.textContent='não consegui carregar. recarrega a página.'; });
  }
  elSave.addEventListener('click', function(){
    var who=elWho.value.trim();
    if(!who){ elStatus.className='status err'; elStatus.textContent='põe seu nome antes de salvar 🙂'; elWho.focus(); return; }
    elSave.disabled=true; elStatus.className='status'; elStatus.textContent='salvando...';
    var body={contexto:ctx, slot:cur, copy:elCopy.value, criativo:elCri.value, by:who};
    fetch('/api/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();}).then(function(j){
        elSave.disabled=false;
        if(j&&j.ok){ DATA[cur]={copy:elCopy.value,criativo:elCri.value,by:who,at:(j.salvo&&j.salvo.at)||new Date().toISOString()};
          elStatus.className='status ok'; elStatus.textContent = ctx==='anuncios' ? 'salvo ✓ · o Austin já usa essa regra' : 'salvo ✓';
          renderPills();
        } else { elStatus.className='status err'; elStatus.textContent='erro ao salvar: '+((j&&j.erro)||'tenta de novo'); }
      }).catch(function(){ elSave.disabled=false; elStatus.className='status err'; elStatus.textContent='falha de rede, tenta de novo'; });
  });
  renderPills(); load();
</script>
</body>
</html>
