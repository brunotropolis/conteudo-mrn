<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Calendário de posts · HUB Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  :root{--bg:#E8F1F0;--panel:#fff;--card:#F4F9F8;--hover:#E9F3F1;--line:#DCE8E6;--ink:#23332F;--mute:#6E827D;--dim:#93A5A1;--gold:#E3A31B;--gold2:#C88C10;--goldink:#8A5E0A;--menu:#3A5049;--menuTxt:#E7EEEC;--menuMute:#9DB3AD;--live:#1E874B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .top{background:var(--menu);color:var(--menuTxt);padding:18px 22px;display:flex;align-items:center;gap:14px}
  .top .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;overflow:hidden}
  .top .logo img{width:100%;height:100%;display:block}
  .top .tt{min-width:0;flex:1}
  .top h1{font-size:1.18rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top p{color:var(--menuMute);font-size:.82rem;margin-top:2px}
  .top .back{flex:0 0 auto;color:var(--menuTxt);font-size:.82rem;font-weight:700;background:rgba(255,255,255,.10);padding:8px 13px;border-radius:10px}
  .wrap{max-width:1120px;margin:0 auto;padding:22px 18px 80px}

  /* ── barra de navegação ── */
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .nav{display:flex;align-items:center;gap:8px}
  .nav button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--menu);font-size:18px;cursor:pointer;display:grid;place-items:center}
  .nav button:hover{border-color:var(--gold);color:var(--goldink)}
  .nav .m{font-size:1.05rem;font-weight:800;min-width:170px;text-align:center}
  .bar .sp{flex:1}
  .bar .novo{background:var(--menu);color:#fff;border:none;border-radius:11px;padding:10px 16px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .bar .novo:hover{background:#2f423c}

  /* ── calendário ── */
  .cal{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 18px rgba(35,51,47,.05)}
  .dows{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-bottom:1px solid var(--line)}
  .dows div{padding:9px 6px;text-align:center;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .cell{min-height:110px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;position:relative;overflow:hidden}
  .cell:nth-child(7n){border-right:none}
  .cell.out{background:#F3F8F7}
  .cell .dn{font-size:12px;font-weight:700;color:var(--mute);margin-bottom:4px;line-height:1}
  .cell.today .dn{background:var(--gold);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
  .ev{display:flex;align-items:flex-start;gap:6px;background:#FCF7EC;border:1px solid #EFE1BE;border-left:3px solid var(--gold);border-radius:8px;padding:5px 6px;margin-bottom:5px;cursor:pointer;overflow:hidden}
  .ev:hover{border-color:var(--gold2)}
  .ev.rascunho{border-left-color:var(--dim);background:#F8F8F8}
  .ev.publicado{border-left-color:var(--live);background:#EEF8F2}
  .ev.erro{border-left-color:#B2432C;background:#FDF3F1}
  .ev .th{width:28px;height:28px;border-radius:5px;overflow:hidden;background:var(--hover);flex:0 0 auto;display:grid;place-items:center;margin-top:1px}
  .ev .th img{width:100%;height:100%;object-fit:cover}
  .ev .th .v{width:13px;height:13px;fill:#5B726B}
  .ev .tx{min-width:0;line-height:1.2;flex:1}
  .ev .tx .ttl{font-size:10.5px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
  .ev .tx .hm{font-size:9.5px;color:var(--mute);display:block}
  .ev .tx .leg{font-size:9.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

  /* ── seção genérica ── */
  .sec{margin-top:28px}
  .sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sec-hd h2{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
  .sec-hd .cnt{font-size:.78rem;color:var(--dim);font-weight:600}

  /* ── Fila ── */
  .fila-grid{display:grid;gap:10px}
  .frow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
  .frow:hover{border-color:var(--gold)}
  .frow .fth{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--hover);flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line)}
  .frow .fth img{width:100%;height:100%;object-fit:cover}
  .frow .fth .v{width:22px;height:22px;fill:#5B726B}
  .frow .finfo{flex:1;min-width:0}
  .frow .finfo .fname{font-size:14px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frow .finfo .fmeta{font-size:11.5px;color:var(--mute);display:flex;gap:10px;margin-top:3px;flex-wrap:wrap}
  .frow .finfo .fmeta span{display:flex;align-items:center;gap:4px}
  .frow .finfo .fmeta .tag{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
  .frow .finfo .fmeta .auto-on{background:#EEF8F2;border:1px solid #B9E6CA;border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:700;color:var(--live)}
  .frow .finfo .fmeta .auto-off{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:10.5px;font-weight:700;color:var(--dim)}
  .frow .fdt{text-align:right;flex:0 0 auto}
  .frow .fdt .fdia{font-size:12px;font-weight:800;color:var(--ink)}
  .frow .fdt .fhm{font-size:11px;color:var(--mute)}
  .frow .fdt .fbadge{font-size:9.5px;font-weight:700;border-radius:20px;padding:2px 8px;display:inline-block;margin-top:4px}
  .fbadge.agendado{background:#FEF7E6;color:#9A6800;border:1px solid #FAEBC7}
  .fbadge.publicado{background:#EEF8F2;color:#1A5E33;border:1px solid #B9E6CA}
  .fbadge.rascunho{background:#F3F3F3;color:var(--mute);border:1px solid var(--line)}
  .fbadge.erro{background:#FDF3F1;color:#9B3A28;border:1px solid #F5C6BC}

  /* ── Histórico ── */
  .hist-grid{display:grid;gap:10px}
  .hrow{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 14px}
  .hrow .hth{width:44px;height:44px;border-radius:9px;overflow:hidden;background:var(--hover);flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line)}
  .hrow .hth img{width:100%;height:100%;object-fit:cover}
  .hrow .hth .v{width:18px;height:18px;fill:#5B726B}
  .hrow .hinfo{flex:1;min-width:0}
  .hrow .hinfo .hname{font-size:13px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hrow .hinfo .hmeta{font-size:11px;color:var(--mute);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
  .hrow .hdt{text-align:right;flex:0 0 auto;font-size:11.5px;color:var(--mute)}
  .hrow .hdt b{display:block;font-size:12px;color:var(--ink)}
  .hist-more{text-align:center;margin-top:12px}
  .hist-more button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 20px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mute);font-family:inherit}
  .hist-more button:hover{border-color:var(--gold);color:var(--goldink)}

  .empty{color:var(--mute);font-size:13px;padding:8px 2px}

  @media(max-width:700px){
    .cell{min-height:80px}
    .ev .tx .leg{display:none}
    .frow .fdt{display:none}
  }
</style>
</head>
<body>
<div class="top">
  <div class="logo"><img src="favicon.svg" alt=""></div>
  <div class="tt"><h1>Calendário de posts</h1><p>Agendados e histórico do Manual</p></div>
  <a class="back" href="publicador.html">← Publicador</a>
</div>
<div class="wrap">

  <!-- navegação do mês -->
  <div class="bar">
    <div class="nav">
      <button id="prev">‹</button>
      <div class="m" id="mlabel">-</div>
      <button id="next">›</button>
    </div>
    <div class="sp"></div>
    <button class="novo" onclick="location.href='publicador.html'">+ Novo post</button>
  </div>

  <!-- calendário -->
  <div class="cal">
    <div class="dows"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div>
    <div class="grid" id="grid"></div>
  </div>

  <!-- FILA — semana vigente -->
  <div class="sec" id="sec-fila">
    <div class="sec-hd">
      <h2>Fila — Semana vigente</h2>
      <span class="cnt" id="fila-cnt"></span>
    </div>
    <div class="fila-grid" id="flist"><div class="empty">carregando…</div></div>
  </div>

  <!-- HISTÓRICO — posts publicados -->
  <div class="sec" id="sec-hist">
    <div class="sec-hd">
      <h2>Histórico — Posts publicados</h2>
      <span class="cnt" id="hist-cnt"></span>
    </div>
    <div class="hist-grid" id="hlist"><div class="empty">carregando…</div></div>
    <div class="hist-more" id="hist-more" style="display:none">
      <button onclick="mostrarMaisHist()">Carregar mais</button>
    </div>
  </div>

</div>

<script>
const AGENDAR = 'https://n8n-n8n.xktssy.easypanel.host/webhook/motor-agendar';
const VIC = '<svg class="v" viewBox="0 0 24 24"><path d="M4 6h11a2 2 0 0 1 2 2v1.4l3.1-2a.6.6 0 0 1 .9.5v8.2a.6.6 0 0 1-.9.5L17 15.1V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>';
window.__vic = VIC;
const esc = s => String(s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const isVid = t => /video|\.mp4|\.mov/i.test(t || '');
let posts = [], cur = new Date(), histLimit = 20;
cur.setDate(1);

function thumbDe(p) {
  const m = (p.midia && p.midia[0]) || {};
  if (p.capa) return `<img src="${esc(p.capa)}" onerror="this.outerHTML=window.__vic">`;
  if (m.url && !isVid(m.tipo)) return `<img src="${esc(m.url)}" onerror="this.outerHTML=window.__vic">`;
  if (m.url && isVid(m.tipo)) return `<img src="${esc(m.url)}.poster.jpg" onerror="this.outerHTML=window.__vic">`;
  return VIC;
}

function legLine(p) {
  const l = (p.legenda || '').replace(/\n/g, ' ').trim();
  return l ? esc(l.slice(0, 50)) : (p.tipo || 'post');
}

function tipoLabel(t) {
  return {'reels':'Reels','carrossel':'Carrossel','foto':'Foto','story':'Story'}[t] || (t || 'Post');
}

function fmtDia(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'short'}).replace('.','');
}

function fmtHm(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}

// semana vigente: seg-dom da semana atual
function semanaVigente() {
  const now = new Date();
  const dow = now.getDay();
  const seg = new Date(now);
  seg.setDate(now.getDate() - ((dow + 6) % 7));
  seg.setHours(0, 0, 0, 0);
  const dom = new Date(seg);
  dom.setDate(seg.getDate() + 6);
  dom.setHours(23, 59, 59, 999);
  return { seg, dom };
}

async function carregar() {
  try {
    const r = await fetch(AGENDAR, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({acao: 'listar'})
    }).then(r => r.json());
    posts = r.dados || [];
  } catch(e) { posts = []; }
  render();
  renderFila();
  renderHist();
}

// ── CALENDÁRIO ──────────────────────────────────────
function render() {
  const y = cur.getFullYear(), mo = cur.getMonth();
  const mn = cur.toLocaleDateString('pt-BR', {month: 'long'});
  document.getElementById('mlabel').textContent =
    mn.charAt(0).toUpperCase() + mn.slice(1) + ' de ' + y;

  const first = new Date(y, mo, 1);
  const start = first.getDay();
  const dim = new Date(y, mo + 1, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // agrupa posts agendados do mês por dia
  const byDay = {};
  posts.filter(p => p.agendado_para && p.status !== 'cancelado').forEach(p => {
    const d = new Date(p.agendado_para);
    if (d.getFullYear() === y && d.getMonth() === mo) {
      const k = d.getDate();
      (byDay[k] = byDay[k] || []).push(p);
    }
  });

  let html = '';
  for (let i = 0; i < start; i++) html += '<div class="cell out"></div>';
  for (let d = 1; d <= dim; d++) {
    const cd = new Date(y, mo, d);
    const evs = (byDay[d] || []).sort((a, b) => new Date(a.agendado_para) - new Date(b.agendado_para));
    html += `<div class="cell${cd.getTime() === today.getTime() ? ' today' : ''}">` +
      `<div class="dn">${d}</div>` +
      evs.map(p => {
        const hm = fmtHm(p.agendado_para);
        const titulo = esc((p.titulo || '').trim() || p.tipo || 'post');
        return `<div class="ev ${p.status}" onclick="location.href='publicador.html?edit=${p.id}'">`+
          `<div class="th">${thumbDe(p)}</div>`+
          `<div class="tx">`+
            `<span class="ttl">${titulo}</span>`+
            `<span class="hm">${hm}</span>`+
            `<span class="leg">${legLine(p)}</span>`+
          `</div></div>`;
      }).join('') +
    '</div>';
  }
  const cells = start + dim;
  for (let i = cells; i % 7 !== 0; i++) html += '<div class="cell out"></div>';
  document.getElementById('grid').innerHTML = html;
}

// ── FILA (semana vigente) ────────────────────────────
function renderFila() {
  const { seg, dom } = semanaVigente();
  const fila = posts.filter(p => {
    if (!p.agendado_para) return false;
    const d = new Date(p.agendado_para);
    return d >= seg && d <= dom && p.status !== 'cancelado';
  }).sort((a, b) => new Date(a.agendado_para) - new Date(b.agendado_para));

  document.getElementById('fila-cnt').textContent = fila.length ? `${fila.length} post${fila.length > 1 ? 's' : ''}` : '';

  if (!fila.length) {
    document.getElementById('flist').innerHTML = '<div class="empty">Nenhum post agendado para esta semana.</div>';
    return;
  }

  document.getElementById('flist').innerHTML = fila.map(p => {
    const aut = p.automacao || {};
    const autLabel = aut.ativa && aut.fluxo_nome
      ? `<span class="auto-on">⚡ ${esc(String(aut.fluxo_nome).slice(0, 40))}</span>`
      : `<span class="auto-off">Sem automação</span>`;
    const badge = `<span class="fbadge ${p.status}">${p.status}</span>`;
    return `<div class="frow" onclick="location.href='publicador.html?edit=${p.id}'">
      <div class="fth">${thumbDe(p)}</div>
      <div class="finfo">
        <span class="fname">${esc(p.titulo || p.tipo || 'sem título')}</span>
        <div class="fmeta">
          <span class="tag">${tipoLabel(p.tipo)}</span>
          ${autLabel}
          <span>${esc(legLine(p).slice(0, 50))}</span>
        </div>
      </div>
      <div class="fdt">
        <div class="fdia">${fmtDia(p.agendado_para)}</div>
        <div class="fhm">${fmtHm(p.agendado_para)}</div>
        ${badge}
      </div>
    </div>`;
  }).join('');
}

// ── HISTÓRICO (posts publicados) ─────────────────────
let histAll = [];
function renderHist() {
  histAll = posts.filter(p => p.status === 'publicado')
    .sort((a, b) => new Date(b.publicado_em || b.agendado_para || 0) - new Date(a.publicado_em || a.agendado_para || 0));

  document.getElementById('hist-cnt').textContent = histAll.length ? `${histAll.length} post${histAll.length > 1 ? 's' : ''}` : '';
  renderHistPage();
}

function renderHistPage() {
  if (!histAll.length) {
    document.getElementById('hlist').innerHTML = '<div class="empty">Nenhum post publicado ainda.</div>';
    document.getElementById('hist-more').style.display = 'none';
    return;
  }
  const page = histAll.slice(0, histLimit);
  document.getElementById('hlist').innerHTML = page.map(p => {
    const aut = p.automacao || {};
    const dtPub = p.publicado_em || p.agendado_para;
    return `<div class="hrow">
      <div class="hth">${thumbDe(p)}</div>
      <div class="hinfo">
        <span class="hname">${esc(p.titulo || p.tipo || 'sem título')}</span>
        <div class="hmeta">
          <span>${tipoLabel(p.tipo)}</span>
          ${aut.fluxo_nome ? `<span>⚡ ${esc(String(aut.fluxo_nome).slice(0, 35))}</span>` : ''}
          <span>${esc(legLine(p).slice(0, 60))}</span>
        </div>
      </div>
      <div class="hdt"><b>${fmtDia(dtPub)}</b>${fmtHm(dtPub)}</div>
    </div>`;
  }).join('');
  document.getElementById('hist-more').style.display = histAll.length > histLimit ? '' : 'none';
}

function mostrarMaisHist() { histLimit += 20; renderHistPage(); }

// controles de navegação
document.getElementById('prev').onclick = () => { cur.setMonth(cur.getMonth() - 1); render(); };
document.getElementById('next').onclick = () => { cur.setMonth(cur.getMonth() + 1); render(); };

carregar();
</script>
<script src="sidebar.js" defer></script>
</body>
</html>
