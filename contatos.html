<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Contatos · HUB Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  :root{--bg:#E8F1F0;--panel:#fff;--line:#E6E0D0;--ink:#1A2522;--mute:#5A6B65;--dim:#6B7B76;--gold:#E3A31B;--menu:#3A5049;--live:#1E874B;--ig:#C13584;--fb:#1877F2}
  *{margin:0;padding:0;box-sizing:border-box} [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.45;overflow-x:hidden}
  .top{background:var(--menu);color:#E7EEEC;padding:18px 22px}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
  .pagehdr{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 4px 14px}
  .pagehdr h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
  .resumo{font-size:.85rem;color:var(--mute);font-weight:600}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 16px rgba(35,51,47,.05);overflow:hidden}
  .filtros{padding:12px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .filtros input,.filtros select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:#FBFAF6;color:var(--ink)}
  .filtros input[type=search]{flex:1;min-width:200px}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#FBFAF6;font:700 12.5px inherit;font-family:inherit;padding:9px 14px;color:var(--mute);cursor:pointer}
  .seg button.on{background:var(--menu);color:#fff}
  .tg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--mute);white-space:nowrap;cursor:pointer}
  .tg input{width:15px;height:15px;accent-color:var(--live)}
  .tabwrap{overflow:auto;max-height:calc(100vh - 220px)}
  .tab{width:100%;border-collapse:collapse;font-size:13.5px}
  .tab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:800;padding:11px 14px;border-bottom:1px solid var(--line);background:#FBFAF6;position:sticky;top:0;white-space:nowrap}
  .tab td{padding:11px 14px;border-bottom:1px solid #F0EBDD;vertical-align:middle}
  .tab tr:hover td{background:#FBF8F0;cursor:pointer}
  .pess{display:flex;gap:12px;align-items:center;min-width:0}
  .pess b{display:block;font-size:14px;font-weight:600}
  .pess small{display:block;color:var(--mute);font-size:12px}
  .av{width:40px;height:40px;border-radius:50%;background:#EEF3F1;flex:none;position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--menu);font-size:14px}
  .av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .rd{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:2px solid #fff}
  .rd.instagram{background:var(--ig)} .rd.facebook{background:var(--fb)}
  .vf{display:inline-flex;width:15px;height:15px;border-radius:50%;background:#3897F0;color:#fff;font-size:10px;align-items:center;justify-content:center;margin-left:4px;vertical-align:-2px;font-weight:900}
  .pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;background:#EAF5EE;color:var(--live);margin-left:4px}
  .num{font-variant-numeric:tabular-nums;font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:10.5px;font-weight:600;color:#3A5049;background:#E8EFEA;border-radius:12px;padding:2px 8px;line-height:14px}
  .vazio{color:var(--mute);text-align:center;padding:30px 16px;font-size:13.5px}
  @media (max-width:820px){ .wrap{padding:14px 12px 30px} .pagehdr h1{display:none} .esc{display:none} .filtros select,.seg{width:100%} .seg button{flex:1} }
</style>
</head>
<body>
<div class="top"><b>Contatos</b></div>
<div class="wrap">
  <div class="pagehdr"><h1>Contatos</h1><span class="resumo" id="resumo"></span></div>
  <div class="card">
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar por @ ou nome">
      <div class="seg" id="redes"><button data-r="" class="on">Todas</button><button data-r="instagram">Instagram</button><button data-r="facebook">Facebook</button></div>
      <select id="ftag"><option value="">Todos os fluxos</option></select>
      <select id="ord"><option value="recentes">Interação mais recente</option><option value="primeiros">Primeira interação</option><option value="seguidores">Mais seguidores</option></select>
    </div>
    <div class="tabwrap"><table class="tab"><thead><tr><th>Pessoa</th><th>Rede</th><th>1ª interação</th><th class="esc">Última</th><th class="esc">Interações</th><th>Fluxos</th></tr></thead><tbody id="tab"><tr><td colspan="6" class="vazio">carregando…</td></tr></tbody></table></div>
  </div>
</div>
<script src="sidebar.js?v=20261008c"></script>
<script>
const API='/api/n8n/motor-inbox';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(b)=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();};
const dataCurta=iso=>iso?new Date(iso).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}):'—';
const nomeDe=c=>c.username?'@'+c.username:(c.nome||('Contato '+String(c.usuario_id).slice(-5)));
const inicial=c=>(c.username||c.nome||'?').replace(/[^a-zA-ZÀ-ÿ0-9]/g,'').charAt(0).toUpperCase()||'?';
const avatar=c=>'<div class="av">'+(c.foto_url?'<img src="'+esc(c.foto_url)+'" alt="" onerror="this.remove()">':esc(inicial(c)))+'<span class="rd '+esc(c.rede)+'"></span></div>';
let f={rede:'',tag:'',busca:'',ordem:'recentes'};
async function carregar(){
  try{
    const r=await api(Object.assign({acao:'pessoas'},f)); const d=r.dados||{}; const ps=d.lista||[];
    $('resumo').textContent=(d.total||0)+' contato'+(d.total===1?'':'s')+(ps.length<(d.total||0)?' · mostrando '+ps.length:'');
    $('tab').innerHTML=ps.length?ps.map(c=>'<tr data-id="'+c.id+'"><td><div class="pess">'+avatar(c)+'<div style="min-width:0"><b>'+esc(nomeDe(c))+(c.verificado?'<span class="vf" title="Verificado">✓</span>':'')+(c.segue_voce?'<span class="pill">segue</span>':'')+'</b>'+
      (c.nome&&c.username?'<small>'+esc(c.nome)+'</small>':'')+'</div></div></td>'+
      '<td>'+(c.rede==='facebook'?'Facebook':'Instagram')+'</td><td>'+dataCurta(c.primeiro_em)+'</td><td class="esc">'+dataCurta(c.ultimo_em)+'</td><td class="esc num">'+(c.interacoes||0)+'</td>'+
      '<td>'+((c.tags||[]).length?'<div class="tags">'+c.tags.map(t=>'<span class="tag">#'+esc(t)+'</span>').join('')+'</div>':'<span style="color:var(--dim)">—</span>')+'</td></tr>').join('')
      :'<tr><td colspan="6" class="vazio">Nenhum contato com esse filtro.</td></tr>';
  }catch(e){$('tab').innerHTML='<tr><td colspan="6" class="vazio">Não consegui carregar ('+esc(e.message)+').</td></tr>';}
}
api({acao:'tags'}).then(r=>{$('ftag').innerHTML='<option value="">Todos os fluxos</option>'+(r.dados||[]).map(t=>'<option value="'+esc(t.tag)+'">'+esc(t.tag)+' ('+t.n+')</option>').join('');}).catch(()=>{});
$('redes').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#redes button').forEach(x=>x.classList.toggle('on',x===b));f.rede=b.dataset.r;carregar();});
$('ftag').onchange=e=>{f.tag=e.target.value;carregar();};
$('ord').onchange=e=>{f.ordem=e.target.value;carregar();};
let tb; $('busca').oninput=e=>{clearTimeout(tb);tb=setTimeout(()=>{f.busca=e.target.value.trim();carregar();},350);};
carregar();
</script>
</body>
</html>
