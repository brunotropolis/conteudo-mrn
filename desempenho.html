<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Melhores Conteúdos · HUB Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  :root{--bg:#E8F1F0;--panel:#fff;--card:#F4F9F8;--hover:#E9F3F1;--line:#DCE8E6;--ink:#23332F;--mute:#6E827D;--dim:#93A5A1;--gold:#E3A31B;--gold2:#C88C10;--goldink:#8A5E0A;--goldbg:#FDF1D6;--teal:#17A2A0;--blue:#4E7CA6;--menu:#3A5049;--menuTxt:#E7EEEC;--menuMute:#9DB3AD}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
  a{color:inherit;text-decoration:none}

  .top{background:var(--menu);color:var(--menuTxt);padding:18px 22px;display:flex;align-items:center;gap:14px}
  .top .logo{width:42px;height:42px;border-radius:12px;flex:0 0 auto;overflow:hidden}
  .top .logo img{width:100%;height:100%;display:block}
  .top .tt{min-width:0;flex:1}
  .top h1{font-size:1.18rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top p{color:var(--menuMute);font-size:.82rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .back{flex:0 0 auto;color:var(--menuTxt);font-size:.82rem;font-weight:700;background:rgba(255,255,255,.10);padding:8px 13px;border-radius:10px}
  .top .back:hover{background:rgba(255,255,255,.18)}

  .wrap{max-width:1000px;margin:0 auto;padding:26px 18px 70px}
  .meta{color:var(--mute);font-size:.85rem;margin:0 4px 18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  .meta b{color:var(--ink)}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 18px rgba(35,51,47,.05)}
  .kpi .lab{font-size:11px;color:#52615A;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
  .kpi .val{font-size:25px;font-weight:800;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .kpi.hi .val{color:var(--goldink)}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 18px rgba(35,51,47,.05)}
  .panel h2{margin:0 0 14px;font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}

  .tipos{display:flex;flex-direction:column;gap:13px}
  .tipo{display:grid;grid-template-columns:92px 1fr auto;align-items:center;gap:12px}
  .tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;text-align:center;text-transform:capitalize}
  .tag.reels{background:rgba(58,80,73,.12);color:var(--menu)}
  .tag.carrossel{background:rgba(110,130,125,.16);color:#54655F}
  .tag.foto{background:rgba(200,140,16,.16);color:var(--goldink)}
  .bar{height:8px;background:var(--hover);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;border-radius:999px}
  .tipo .num{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tipo .num b{color:var(--ink)}

  .insight{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:18px;padding:18px 20px;font-size:.92rem;line-height:1.62;color:var(--ink);box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 18px rgba(35,51,47,.05)}
  .insight b{color:var(--goldink);font-weight:800}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 14px;align-items:center}
  .filters .flabel{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .filters .grp{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);padding:5px;border-radius:12px}
  .chip{font-size:12.5px;font-weight:700;color:var(--mute);padding:6px 12px;border-radius:8px;cursor:pointer;border:none;background:none;font-family:inherit}
  .chip.on{background:var(--menu);color:#fff}
  .filters .spacer{flex:1}
  .filters .count{font-size:12.5px;color:var(--mute)}

  .list{display:flex;flex-direction:column;gap:10px}
  .post{display:grid;grid-template-columns:32px 60px 1fr;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px 12px 12px;box-shadow:0 1px 2px rgba(35,51,47,.04);transition:transform .12s,box-shadow .12s,border-color .12s}
  .post:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(35,51,47,.08);border-color:var(--gold)}
  .post.podium{border-left:4px solid var(--gold)}
  .rank{font-size:15px;font-weight:800;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums}
  .rank.top{color:var(--goldink)}
  .thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:var(--hover);display:block}
  .thumb.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
  .pmain{min-width:0}
  .ptop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .pdate{font-size:12px;color:#52615A}
  .pcap{font-size:13.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px}
  .metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .met{display:flex;flex-direction:column;gap:1px;min-width:0}
  .met b{color:var(--ink);font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
  .met span{font-size:10px;color:#52615A;text-transform:uppercase;letter-spacing:.03em}
  .met.key b{color:var(--goldink)}

  footer{color:var(--dim);text-align:center;font-size:.78rem;padding:10px 20px 40px}

  @media(max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr)} .row2{grid-template-columns:1fr} }
  @media(max-width:520px){
    .post{grid-template-columns:24px 50px 1fr;gap:10px}
    .thumb{width:50px;height:50px}
    .metrics{gap:6px}.met b{font-size:12.5px}.met span{font-size:9px}
    .tipo{grid-template-columns:56px 1fr auto;gap:8px}
    .tipo .num{font-size:11px}
    .filters .grp{flex-wrap:wrap}
    .filters .count{width:100%;text-align:right}
  }
</style>
</head>
<body>
<div class="top">
  <div class="logo"><img src="favicon.svg" alt=""></div>
  <div class="tt"><h1>Melhores Conteúdos</h1><p id="sub">carregando…</p></div>
  <a class="back" href="index.html">← HUB</a>
</div>
<div class="wrap">
  <div class="meta" id="meta"></div>

  <div class="kpis" id="kpis"></div>

  <div class="row2">
    <div class="panel"><h2>Desempenho por formato</h2><div class="tipos" id="tipos"></div></div>
    <div class="insight" id="insight"></div>
  </div>

  <div class="filters">
    <span class="flabel">Formato</span>
    <div class="grp" id="fTipo">
      <button class="chip on" data-t="todos">Todos</button>
      <button class="chip" data-t="reels">Reels</button>
      <button class="chip" data-t="carrossel">Carrossel</button>
      <button class="chip" data-t="foto">Foto</button>
    </div>
    <span class="flabel">Período</span>
    <div class="grp" id="fPer">
      <button class="chip" data-p="7">7 dias</button>
      <button class="chip" data-p="30">30 dias</button>
      <button class="chip on" data-p="all">Tudo</button>
    </div>
    <div class="spacer"></div>
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list"></div>
</div>
<footer>Uso interno · Manual do Recém-Nascido · dados do Instagram (Graph API)</footer>

<script>
const fmt = n => n==null ? '—'
  : n>=1e6 ? (n/1e6).toFixed(1).replace('.',',')+'M'
  : n>=1000 ? (n/1000).toFixed(n>=1e4?0:1).replace('.',',')+'k'
  : String(n);
const ICON = {reels:'🎬', carrossel:'🖼️', foto:'📷'};
let DADOS=null, fTipo='todos', fPer='all';

function render(){
  let posts = DADOS.posts.slice();
  if(fTipo!=='todos') posts = posts.filter(p=>p.tipo===fTipo);
  if(fPer!=='all'){ const lim=Date.now()-fPer*864e5; posts = posts.filter(p=>new Date(p.publicado_em).getTime()>=lim); }
  posts.sort((a,b)=>(b.engajamento||0)-(a.engajamento||0));
  document.getElementById('count').textContent = posts.length+' posts';
  document.getElementById('list').innerHTML = posts.map((p,i)=>{
    const dia = new Date(p.publicado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
    const thumb = p.thumb
      ? `<img class="thumb" src="${p.thumb}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb ph',textContent:'${ICON[p.tipo]}'}))">`
      : `<div class="thumb ph">${ICON[p.tipo]}</div>`;
    return `<a class="post ${i<3?'podium':''}" href="${p.permalink}" target="_blank" rel="noopener">
      <div class="rank ${i<3?'top':''}">${i+1}</div>
      ${thumb}
      <div class="pmain">
        <div class="ptop"><span class="tag ${p.tipo}">${p.tipo}</span><span class="pdate">${dia}</span></div>
        <div class="pcap">${(p.legenda||'').replace(/</g,'&lt;')||'—'}</div>
        <div class="metrics">
          <div class="met key"><b>${fmt(p.engajamento)}</b><span>engaj.</span></div>
          <div class="met"><b>${fmt(p.alcance)}</b><span>alcance</span></div>
          <div class="met"><b>${fmt(p.salvamentos)}</b><span>salvos</span></div>
          <div class="met"><b>${fmt(p.compartilhamentos)}</b><span>compart.</span></div>
          <div class="met"><b>${fmt(p.comentarios)}</b><span>coment.</span></div>
        </div>
      </div></a>`;
  }).join('') || `<div class="panel" style="text-align:center;color:var(--mute)">Nenhum post nesse filtro.</div>`;
}

function boot(d){
  DADOS=d; const r=d.resumo;
  document.getElementById('sub').textContent = `Manual do Recém-Nascido · @${d.conta.username}`;
  document.getElementById('meta').innerHTML =
    `<span>últimas <b>${d.periodo_semanas} semanas</b> · <b>${r.n_posts}</b> publicações</span>`+
    `<span><b>${fmt(d.conta.seguidores)}</b> seguidores · atualizado ${new Date(d.gerado_em).toLocaleDateString('pt-BR')}</span>`;

  document.getElementById('kpis').innerHTML = [
    ['Publicações', r.n_posts, ''],
    ['Alcance total', fmt(r.alcance_total), 'hi'],
    ['Engaj. médio/post', fmt(r.eng_medio), ''],
    ['Salvamentos', fmt(r.salvamentos_total), ''],
    ['Compartilham.', fmt(r.compart_total), ''],
  ].map(([l,v,c])=>`<div class="kpi ${c}"><div class="lab">${l}</div><div class="val">${v}</div></div>`).join('');

  const maxEng = Math.max(...Object.values(d.por_tipo).map(t=>t.eng_medio),1);
  document.getElementById('tipos').innerHTML = Object.entries(d.por_tipo).map(([t,v])=>`
    <div class="tipo">
      <span class="tag ${t}">${t}</span>
      <div class="bar"><i style="width:${Math.round(v.eng_medio/maxEng*100)}%;background:var(--${t==='reels'?'menu':t==='carrossel'?'mute':'goldink'})"></i></div>
      <span class="num"><b>${fmt(v.eng_medio)}</b> eng · ${v.n} posts</span>
    </div>`).join('');

  const best=d.posts[0], reelsN=d.por_tipo.reels?.n||0, total=r.n_posts;
  const bestDia = best ? new Date(best.publicado_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}) : '';
  document.getElementById('insight').innerHTML =
    `<b>Leitura rápida.</b> O melhor post (${bestDia}) fez <b>${fmt(best?.engajamento)}</b> de engajamento e
     <b>${fmt(best?.alcance)}</b> de alcance. Reels são <b>${Math.round(reelsN/total*100)}%</b> das publicações e
     puxam quase todo o alcance — o gancho <b>"comente PALAVRA"</b> lidera compartilhamentos (é ativação de ManyChat).
     Replicar o formato dos 3 primeiros é a aposta mais segura.`;

  document.querySelectorAll('#fTipo .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fTipo .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');fTipo=b.dataset.t;render();});
  document.querySelectorAll('#fPer .chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('#fPer .chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');fPer=b.dataset.p;render();});
  render();
}

fetch('./dados.json?_='+Date.now()).then(r=>r.json()).then(boot)
  .catch(e=>document.getElementById('sub').textContent='erro ao carregar dados.json');
</script>
</body>
</html>
