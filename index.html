<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Início · HUB Conteúdo do Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  :root{--bg:#E8F1F0;--panel:#fff;--card:#F4F9F8;--hover:#E9F3F1;--line:#DCE8E6;--ink:#23332F;--mute:#6E827D;--dim:#93A5A1;--gold:#E3A31B;--gold2:#C88C10;--goldink:#8A5E0A;--goldbg:#FDF1D6;--menu:#3A5049;--live:#1E874B}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  .top{background:var(--menu);color:#E7EEEC;padding:18px 22px}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 22px 70px}
  .pagehdr{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .pagehdr h1{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
  .pagehdr p{color:var(--mute);font-size:.9rem;margin-top:2px}
  .pagehdr .up{font-size:11.5px;color:var(--dim)}
  .novo{background:var(--menu);color:#fff;border:none;border-radius:12px;padding:11px 17px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit}
  .novo:hover{background:#2f423c}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 17px;box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 16px rgba(35,51,47,.05)}
  .kpi .lb{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);display:flex;align-items:center;gap:7px}
  .kpi .lb .d{width:24px;height:24px;border-radius:8px;background:var(--goldbg);color:var(--gold2);display:grid;place-items:center}
  .kpi .lb .d svg{width:14px;height:14px;fill:currentColor}
  .kpi .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-top:9px;line-height:1}
  .kpi .dl{font-size:11.5px;font-weight:700;margin-top:6px;color:var(--dim)}
  .kpi .dl.up{color:var(--live)}
  .kpi.hero{background:linear-gradient(155deg,#3A5049,#2c3d37);color:#fff;border-color:#2c3d37}
  .kpi.hero .lb{color:#B7C9C3}.kpi.hero .lb .d{background:rgba(255,255,255,.12);color:#F0D48A}
  .kpi.hero .dl.up{color:#8FE0AE}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(35,51,47,.04),0 6px 18px rgba(35,51,47,.05)}
  .panel h2{font-size:.82rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
  .panel .sub{font-size:12px;color:var(--dim);margin-bottom:14px}
  .growth{margin-bottom:16px}
  .growth .hd{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .growth .big{font-size:1.55rem;font-weight:800;letter-spacing:-.02em}
  .growth .big span{color:var(--live)}
  .growth .meta{font-size:12px;color:#55655F;font-weight:600}
  .chart{width:100%;height:130px;display:block}
  .chart rect{fill:var(--gold);opacity:.9}
  .chart rect:hover{opacity:1}
  .chart .axis{stroke:var(--line);stroke-width:1}
  .cxlab{fill:var(--dim);font-size:9px}

  .dash2{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
  .list{display:flex;flex-direction:column}
  .row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--hover);border-radius:10px}
  .row .th{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--hover);border:1px solid var(--line);display:grid;place-items:center;position:relative}
  .row .th img{width:100%;height:100%;object-fit:cover}
  .row .th .v{width:22px;height:22px;fill:#5B726B}
  .row .th .pl{position:absolute;left:4px;bottom:4px;width:14px;height:14px;fill:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
  .row .info{min-width:0}
  .row .info b{font-size:13px;font-weight:700;display:block}
  .row .info small{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .row .when{text-align:right;flex:0 0 auto}
  .row .when .d1{font-size:12.5px;font-weight:800;color:var(--menu);text-transform:capitalize}
  .row .when .d2{font-size:11px;color:var(--mute)}
  .stchip{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em;background:var(--goldbg);color:var(--goldink)}
  .stchip.rascunho{background:var(--hover);color:var(--mute)}

  .drow{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line)}
  .drow:last-child{border-bottom:none}
  .drow .th{width:54px;height:54px;border-radius:11px;overflow:hidden;background:var(--hover);border:1px solid var(--line);position:relative;flex:0 0 auto}
  .drow .th img{width:100%;height:100%;object-fit:cover}
  .drow .th .rk{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .drow .info{min-width:0}
  .drow .info b{font-size:12.5px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .drow .mx{display:flex;gap:15px;margin-top:6px;flex-wrap:wrap}
  .drow .mx span{font-size:11px;color:var(--mute);display:inline-flex;align-items:center;gap:4px}
  .drow .mx span b{color:var(--ink);font-weight:800}
  .drow .mx .gain{color:var(--live);font-weight:800}
  .empty{text-align:center;color:var(--mute);font-size:13px;padding:26px 12px}
  .empty .nb{display:inline-block;margin-top:10px;background:var(--menu);color:#fff;border-radius:10px;padding:8px 15px;font-weight:700;font-size:12.5px;cursor:pointer}

  :root{--ig:#C13584;--fb:#1877F2;--tt:#111;--yt:#FF0000}
  .lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#55655F;font-weight:700;margin-top:10px}
  .lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  .nets{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .nets span{font-size:10.5px;font-weight:700;color:#B7C9C3;background:rgba(255,255,255,.09);border-radius:999px;padding:2px 8px}
  .nets span b{color:#fff}
  .rb{font-size:9.5px;font-weight:800;color:#fff !important;border-radius:999px;padding:1px 7px;letter-spacing:.02em}
  .rb.ig{background:var(--ig)}.rb.fb{background:var(--fb)}.rb.tt{background:var(--tt)}.rb.yt{background:var(--yt)}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.dash2{grid-template-columns:1fr}}
  @media(max-width:520px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="pagehdr">
    <div><h1>Início</h1><p>Visão geral do Manual nas 4 redes · <span id="upd" class="up"></span></p></div>
    <button class="novo" onclick="location.href='publicador.html'">+ Novo post</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="panel growth" id="growth">
    <h2>Crescimento de seguidores</h2>
    <div class="hd"><div class="big" id="gBig">-</div><div class="meta" id="gMeta"></div></div>
    <svg class="chart" id="gChart" viewBox="0 0 600 130" preserveAspectRatio="none"></svg>
    <div class="lgd" id="gLgd"></div>
  </div>

  <div class="dash2">
    <div class="panel">
      <h2>Agendados desta semana</h2>
      <div class="sub" id="agSub"></div>
      <div class="list" id="agenda"><div class="empty">carregando…</div></div>
    </div>
    <div class="panel">
      <h2>Destaques do mês</h2>
      <div class="sub" id="deSub">Os posts que mais engajaram, em todas as redes</div>
      <div class="list" id="destaques"><div class="empty">carregando…</div></div>
    </div>
  </div>
</div>

<script>
const AGENDAR='/api/n8n/motor-agendar';
const isVid=t=>/video|reels|\.mp4|\.mov/i.test(t||'');
const VIC='<svg class="v" viewBox="0 0 24 24"><path d="M4 6h11a2 2 0 0 1 2 2v1.4l3.1-2a.6.6 0 0 1 .9.5v8.2a.6.6 0 0 1-.9.5L17 15.1V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/></svg>';
window.__vic=VIC;
const esc=s=>String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const nf=n=>Number(n||0).toLocaleString('pt-BR');
const kf=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' mi':n>=1e3?(n/1e3).toFixed(1).replace('.',',')+' mil':nf(n);};

function icon(p){return '<svg viewBox="0 0 24 24">'+p+'</svg>';}
const IC={foll:'<path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 1a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.7 0-6 1.3-6 4v2h8v-2c0-1 .4-1.9 1-2.6A9 9 0 0 0 8 14zm8 0c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/>',
  reach:'<path d="M12 5c-5 0-9 4.5-9 7s4 7 9 7 9-4.5 9-7-4-7-9-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>',
  eng:'<path d="M12 21s-7-4.35-9.5-8.5C1 9 3 5.5 6.5 5.5 9 5.5 12 8 12 8s3-2.5 5.5-2.5C21 5.5 23 9 21.5 12.5 19 16.65 12 21 12 21z"/>',
  save:'<path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/>'};

// ── thumb helpers ──
function thumbAg(p){ const m=(p.midia&&p.midia[0])||{};
  if(p.capa) return `<img src="${p.capa}" onerror="this.outerHTML=window.__vic">`;
  if(m.url && !isVid(m.tipo)) return `<img src="${m.url}">`;
  if(m.url && isVid(m.tipo)) return `<img src="${m.url}.poster.jpg" onerror="this.outerHTML=window.__vic">`;
  return VIC; }
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];

const REDES={ig:{n:'Instagram',f:'dados.json'},fb:{n:'Facebook',f:'dados-facebook.json'},tt:{n:'TikTok',f:'dados-tiktok.json'},yt:{n:'YouTube',f:'dados-youtube.json'}};
const COR={ig:'#C13584',fb:'#1877F2',tt:'#111',yt:'#FF0000'};
const sumk=(a,k)=>(a||[]).reduce((s,x)=>s+Number(x[k]||0),0);

async function init(){
  const D={};
  await Promise.all(Object.entries(REDES).map(([k,r])=>fetch(r.f+'?_='+Date.now()).then(x=>x.json()).then(d=>{D[k]=d;}).catch(()=>{})));
  const ativos=Object.keys(REDES).filter(k=>D[k]&&D[k].conta);
  renderKPIs(D,ativos); renderGrowth(D); renderDestaques(D,ativos);
  const ts=Math.max(0,...ativos.map(k=>new Date(D[k].gerado_em||0).getTime()));
  if(ts){ const g=new Date(ts); document.getElementById('upd').textContent='atualizado '+g.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+g.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
  renderAgenda();
}

// ganho diário por rede (o TikTok não informa série): {dia:{ig,fb,yt}}
function serieDiaria(D){
  const m={};
  const put=(dia,k,v)=>{ if(!dia) return; (m[dia]=m[dia]||{})[k]=(m[dia][k]||0)+Number(v||0); };
  if(D.ig) Object.entries(D.ig.seguidores_por_dia||{}).forEach(([d,v])=>put(d,'ig',v));
  if(D.fb) (D.fb.crescimento||[]).forEach(x=>put(x.data,'fb',x.ganhos));
  if(D.yt) (D.yt.crescimento||[]).forEach(x=>put(x.data,'yt',x.liquido));
  return m;
}
function noMes(dia){ const n=new Date(), d=new Date(dia+'T12:00:00'); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth(); }

function renderKPIs(D,ativos){
  const seg=ativos.reduce((s,k)=>s+Number(D[k].conta.seguidores||0),0);
  const ser=serieDiaria(D);
  const mes=Object.entries(ser).filter(([d])=>noMes(d)).reduce((s,[,v])=>s+(v.ig||0)+(v.fb||0)+(v.yt||0),0);
  const ytViews=D.yt?((D.yt.crescimento&&D.yt.crescimento.length)?sumk(D.yt.crescimento,'views'):Number(D.yt.resumo.views_total||0)):0;
  const exp=(D.ig?Number(D.ig.resumo.alcance_total||0):0)+(D.tt?Number(D.tt.resumo.views_total||0):0)+ytViews;
  const eng=ativos.reduce((s,k)=>s+Number(D[k].resumo.eng_total||0),0);
  const pub=ativos.reduce((s,k)=>s+Number(D[k].resumo.n_posts||D[k].resumo.n_videos||0),0);
  const sem=(D.ig&&D.ig.periodo_semanas)||8;
  const chips=[...ativos].sort((a,b)=>D[b].conta.seguidores-D[a].conta.seguidores).map(k=>`<span>${REDES[k].n} <b>${kf(D[k].conta.seguidores)}</b></span>`).join('');
  document.getElementById('kpis').innerHTML=`
    <div class="kpi hero"><div class="lb"><span class="d">${icon(IC.foll)}</span>Seguidores · ${ativos.length} redes</div><div class="v">${kf(seg)}</div><div class="dl up">▲ +${nf(mes)} este mês</div><div class="nets">${chips}</div></div>
    <div class="kpi"><div class="lb"><span class="d">${icon(IC.reach)}</span>Alcance & views</div><div class="v">${kf(exp)}</div><div class="dl">IG alcance · TikTok/YT views · ${sem} sem</div></div>
    <div class="kpi"><div class="lb"><span class="d">${icon(IC.eng)}</span>Engajamento</div><div class="v">${kf(eng)}</div><div class="dl">somado nas ${ativos.length} redes · ${sem} sem</div></div>
    <div class="kpi"><div class="lb"><span class="d">${icon(IC.save)}</span>Publicações</div><div class="v">${nf(pub)}</div><div class="dl">nas ${ativos.length} redes · ${sem} sem</div></div>`;
}

function renderGrowth(D){
  const ser=serieDiaria(D);
  const dias=Object.keys(ser).sort();
  const last=dias.slice(-30);
  const tot=dias.reduce((s,d)=>s+(ser[d].ig||0)+(ser[d].fb||0)+(ser[d].yt||0),0);
  document.getElementById('gBig').innerHTML=`<span>+${nf(tot)}</span> seguidores`;
  document.getElementById('gMeta').textContent=`~${nf(Math.round(tot/Math.max(1,dias.length)))}/dia · Instagram + Facebook + YouTube`;
  const W=600,H=130,pad=6,n=last.length||1;
  const totDia=d=>['ig','fb','yt'].reduce((s,k)=>s+Math.max(0,ser[d][k]||0),0);
  const max=Math.max(1,...last.map(totDia));
  const bw=(W-pad*2)/n; let bars='',labs='';
  last.forEach((d,i)=>{ const x=pad+i*bw; let y=H-14; const tip=[];
    ['ig','fb','yt'].forEach(k=>{ const v=Math.max(0,ser[d][k]||0); if(!v) return; const h=(v/max)*(H-24); y-=h;
      bars+=`<rect x="${(x+1).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(h,0.5).toFixed(1)}" style="fill:${COR[k]};opacity:.9"></rect>`; tip.push(REDES[k].n+' +'+nf(v)); });
    bars+=`<rect x="${(x+1).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H-14-y).toFixed(1)}" style="fill:transparent"><title>${d}: ${tip.join(' · ')||'sem dado'}</title></rect>`;
    if(i%5===0||i===last.length-1){ const dd=new Date(d+'T12:00:00'); labs+=`<text class="cxlab" x="${(x+bw/2).toFixed(1)}" y="${H-2}" text-anchor="middle">${dd.getDate()}/${dd.getMonth()+1}</text>`; }
  });
  document.getElementById('gChart').innerHTML=`<line class="axis" x1="0" y1="${H-14}" x2="${W}" y2="${H-14}"/>${bars}${labs}`;
  document.getElementById('gLgd').innerHTML=['ig','fb','yt'].filter(k=>D[k]).map(k=>`<span><i style="background:${COR[k]}"></i>${REDES[k].n}</span>`).join('')+'<span style="color:var(--dim);font-weight:600">TikTok não informa ganho por dia</span>';
}

function renderDestaques(D,ativos){
  const all=[];
  ativos.forEach(k=>{ const d=D[k];
    if(k==='ig') (d.posts||[]).forEach(p=>all.push({k,t:p.legenda,th:p.thumb,l:p.permalink,e:p.engajamento,pub:p.publicado_em,m1:p.alcance,m1l:'👁',m2:p.salvamentos,m2l:'🔖'}));
    else if(k==='fb') (d.posts||[]).forEach(p=>all.push({k,t:p.titulo,th:p.thumb,l:p.link,e:p.engajamento,pub:p.publicado_em,m1:p.curtidas,m1l:'👍',m2:p.compartilhamentos,m2l:'↗'}));
    else (d.videos||[]).forEach(v=>all.push({k,t:v.titulo,th:v.thumb,l:v.link,e:v.engajamento,pub:v.publicado_em,m1:v.views,m1l:'▶',m2:v.comentarios,m2l:'💬'}));
  });
  let lista=all.filter(p=>p.pub&&noMes(String(p.pub).slice(0,10)));
  const doMes=lista.length>=3; if(!doMes) lista=all;
  lista.sort((a,b)=>(b.e||0)-(a.e||0));
  const top=lista.slice(0,5);
  document.getElementById('deSub').textContent=doMes?'Os que mais engajaram este mês, em todas as redes':'Os que mais engajaram no período, em todas as redes';
  document.getElementById('destaques').innerHTML=top.length?top.map((p,i)=>`
    <a class="drow" href="${p.l||'#'}" target="_blank" rel="noopener">
      <div class="th"><span class="rk">${i+1}</span>${p.th?`<img src="${p.th}" referrerpolicy="no-referrer" onerror="this.outerHTML=window.__vic">`:VIC}</div>
      <div class="info"><b>${esc((p.t||'post').replace(/\n/g,' ').slice(0,60))}</b>
        <div class="mx"><span class="rb ${p.k}">${REDES[p.k].n}</span><span>❤ <b>${kf(p.e)}</b></span><span>${p.m1l} <b>${kf(p.m1)}</b></span><span>${p.m2l} <b>${kf(p.m2)}</b></span></div>
      </div>
    </a>`).join(''):'<div class="empty">Sem posts no período ainda.</div>';
}

async function renderAgenda(){
  let arr=[];
  try{ const r=await fetch(AGENDAR,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:'listar'})}).then(r=>r.json()); arr=r.dados||[]; }catch(e){}
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setHours(0,0,0,0); mon.setDate(now.getDate()-dow);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  const sem=arr.filter(p=>p.agendado_para && p.status==='agendado').map(p=>({...p,_d:new Date(p.agendado_para)})).filter(p=>p._d>=mon&&p._d<=sun).sort((a,b)=>a._d-b._d);
  document.getElementById('agSub').textContent = `${mon.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}, ${sun.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}`;
  const el=document.getElementById('agenda');
  if(!sem.length){ el.innerHTML='<div class="empty">Nada agendado esta semana.<br><span class="nb" onclick="location.href=\'publicador.html\'">+ Agendar um post</span></div>'; return; }
  el.innerHTML=sem.map(p=>{ const d=p._d;
    return `<div class="row" onclick="location.href='publicador.html?edit=${p.id}'">
      <div class="th">${thumbAg(p)}</div>
      <div class="info"><b>${esc((p.legenda||p.tipo||'post').replace(/\n/g,' ').slice(0,48))}</b><small><span class="stchip ${p.status}">${p.tipo}</span></small></div>
      <div class="when"><div class="d1">${DIAS[d.getDay()]} ${d.getDate()}</div><div class="d2">${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div></div>
    </div>`;
  }).join('');
}
init();
</script>
<script src="sidebar.js" defer></script>
</body>
</html>
