<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Automações · HUB Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  html,body{height:100%;margin:0;background:#E8F1F0;overflow:hidden}
  /* o app de automações roda embutido aqui, dentro da casca do HUB (barra lateral) */
  #app{border:0;display:block;width:100%;height:100dvh;background:#E8F1F0}
  @media(max-width:900px){ #app{height:calc(100dvh - 56px)} }
  #carregando{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#6E827D;font-family:system-ui,sans-serif;font-size:14px}
</style>
</head>
<body>
  <div id="carregando">carregando automações…</div>
  <iframe id="app" src="https://automacoes.manualdorecemnascido.com.br/?embed=1" allow="clipboard-write"
    onload="var c=document.getElementById('carregando'); if(c) c.remove();"></iframe>
<script src="sidebar.js" defer></script>
</body>
</html>
