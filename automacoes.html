<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Automações · HUB Manual</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#3A5049">
<style>
  html,body{height:100%;margin:0;background:#E8F1F0;overflow:hidden}
  /* o app de automações roda embutido aqui, dentro da casca do HUB (barra lateral) */
  /* 31/Out: abas Automações | Funil das automações em cima do app embutido */
  .topo{padding:18px 24px 0}.topo .abas{margin:0 0 12px}
  #app{border:0;display:block;width:100%;height:calc(100dvh - 66px);background:#E8F1F0}
  @media(max-width:900px){ .topo{padding:12px 12px 0} #app{height:calc(100dvh - 56px - 60px)} }
  #carregando{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#6E827D;font-family:system-ui,sans-serif;font-size:14px}
</style>
<!-- trava-mobile: tela travada como app (sem zoom, sem escorregar pro lado) -->
<style id="trava-mobile">
html{overflow-x:hidden;overscroll-behavior-x:none}
html,body{max-width:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:clip}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
@media (max-width:820px){input,select,textarea{font-size:16px!important}}
</style>
<script id="trava-mobile-js">["gesturestart","gesturechange","gestureend"].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault()},{passive:false})});document.addEventListener("touchmove",function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});</script>
</head>
<body>
  <div class="topo"><div class="abas" data-grupo="automacoes"></div></div>
  <div id="carregando">carregando automações…</div>
  <iframe id="app" src="https://automacoes.manualdorecemnascido.com.br/?embed=1" allow="clipboard-write"
    onload="var c=document.getElementById('carregando'); if(c) c.remove();"></iframe>
<script src="sidebar.js?v=20261116" defer></script>
</body>
</html>
